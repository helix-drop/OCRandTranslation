[package]
name = "fnm-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
fnm-core = { path = "../fnm-core" }
fnm-phase1 = { path = "../fnm-phase1" }
fnm-phase2 = { path = "../fnm-phase2" }
fnm-phase3 = { path = "../fnm-phase3" }
fnm-phase4 = { path = "../fnm-phase4" }
fnm-phase5 = { path = "../fnm-phase5" }
fnm-phase6 = { path = "../fnm-phase6" }
fnm-llm-repair = { path = "../fnm-llm-repair" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
pretty_assertions = "1.4"
