[package]
name = "fnm-phase4"
version = "0.1.0"
edition = "2021"

[dependencies]
fnm-core = { path = "../fnm-core" }
fnm-phase1 = { path = "../fnm-phase1" }
fnm-phase2 = { path = "../fnm-phase2" }
fnm-phase3 = { path = "../fnm-phase3" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
rayon = "1.10"
aho-corasick = "1.1"
sha2 = "0.10"

[dev-dependencies]
insta = { version = "1.34", features = ["json"] }
pretty_assertions = "1.4"
tempfile = "3.10"
