[package]
name = "fnm-llm-repair"
version = "0.1.0"
edition = "2021"

[dependencies]
fnm-core = { path = "../fnm-core" }
fnm-phase1 = { path = "../fnm-phase1" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
sha2 = "0.10"
base64 = "0.22"
rapidfuzz = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
insta = { version = "1.34", features = ["json"] }
pretty_assertions = "1.4"
tempfile = "3.10"
