[package]
name = "fnm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"

# 正则与字符串
regex = "1.10"
once_cell = "1.19"
unicode-normalization = "0.1"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 日志
tracing = "0.1"

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Tokenizer
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

pdfium-render = { version = "0.8", features = ["bindings", "sync", "image"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
insta = { version = "1.34", features = ["json", "redactions"] }
pretty_assertions = "1.4"
tempfile = "3.10"

[build-dependencies]
# 嵌入 migrations/*.sql
