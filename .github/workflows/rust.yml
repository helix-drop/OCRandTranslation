name: Rust CI
on:
  push:
    branches: [main]
    paths: ['fnm_re_rs/**']
  pull_request:
    paths: ['fnm_re_rs/**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: fnm_re_rs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: fnm_re_rs
      - run: cargo test --all
        working-directory: fnm_re_rs
      - run: cargo bench --no-run
        working-directory: fnm_re_rs
